# Netlify Configuration for PetConnect
# Deploys Next.js 15 with Prisma (PostgreSQL via Supabase)

[build]
  command = "export DATABASE_URL=${DATABASE_URL:-$SUPABASE_DATABASE_URL} && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'; frame-src 'self' https://www.youtube.com https://player.vimeo.com"

# Cache static assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Google Fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Required environment variables (set in Netlify Dashboard) ──
# DATABASE_URL          — Supabase PostgreSQL connection string
# AUTH_SECRET           — openssl rand -hex 32
# NEXT_PUBLIC_SITE_URL  — Your Netlify site URL (e.g. https://petconnect.netlify.app)
#
# ── Optional ──
# RESEND_API_KEY        — For contact form emails
# CONTACT_FROM_EMAIL    — Verified sender (e.g. PetConnect <noreply@yourdomain.com>)
# CONTACT_TO_EMAIL      — Receives site-wide contact form submissions
# UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN — Rate limiting
# BLOB_READ_WRITE_TOKEN — Vercel Blob file uploads
# PAYMENT_PROVIDER_BASE_URL / PAYMENT_SECRET_KEY / PAYMENT_PUBLIC_KEY — Payments

